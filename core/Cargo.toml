[package]
name = "referenceframe_core"
version = "1.1.1"
edition = "2021"
authors = ["ReferenceFrame Contributors"]
description = "Platform-agnostic picture frame design calculation library"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]  # Regular Rust library (no cdylib - that's for platform wrappers)

[dependencies]
# Serialization support (used across all platforms)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding for shareable URLs
base64 = "0.22"

[dev-dependencies]
approx = "0.5"  # For floating-point comparisons in tests

[profile.release]
opt-level = 3  # Optimize for speed (platform wrappers will configure for their needs)
lto = true     # Link-time optimization
