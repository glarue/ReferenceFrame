[package]
name = "referenceframe_wasm"
version = "0.1.0"
edition = "2021"
authors = ["ReferenceFrame Contributors"]
description = "WebAssembly bindings for ReferenceFrame"

[lib]
crate-type = ["cdylib", "rlib"]  # WASM dynamic library + Rust library

[dependencies]
# Core business logic (pure Rust)
referenceframe_core = { path = "../../../core" }

# WASM bindings
wasm-bindgen = "0.2"

# Error handling for WASM
console_error_panic_hook = { version = "0.1", optional = true }

# Re-export core dependencies needed for WASM interop
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"   # Optimize for size (critical for WASM download speed)
lto = true        # Link-time optimization
codegen-units = 1 # Better optimization, slower compile
