name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Same checks as test.yml (reused, not duplicated); deploy waits for them
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Pinned wasm-pack release (matches local dev); bump version + sha256 together
      WASM_PACK_VERSION: v0.14.0
      WASM_PACK_SHA256: 278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          name="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz
          install -m 755 "${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          rm -rf wasm-pack.tar.gz "${name}"
          wasm-pack --version

      - name: Build WASM bindings
        run: ./build_wasm.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          # Deploy WASM web version (replaces PyScript)
          cp platforms/web/index.html platforms/web/styles.css platforms/web/storage.js deploy/
          cp platforms/web/privacy-policy.html deploy/
          # PWA files
          cp platforms/web/manifest.json platforms/web/sw.js deploy/
          cp -r platforms/web/pkg deploy/
          # Add .nojekyll to prevent Jekyll processing
          touch deploy/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4